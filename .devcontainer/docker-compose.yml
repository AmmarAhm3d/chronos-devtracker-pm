version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: chronos_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
    name: chronos_dev_db_data